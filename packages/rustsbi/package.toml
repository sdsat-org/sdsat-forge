schema = 1
name = "rustsbi"
backend = "cargo"

dependencies = []
version = "7a524db192f4962fa14ef60ee4d78d47717e52dd"
url = "https://codeload.github.com/rustsbi/rustsbi/tar.gz/${version}"
artifact = "rustsbi.elf"

target = "riscv64gc-unknown-none-elf"
build_output = "${source}/target/${target}/release/rustsbi-prototyper-dynamic.elf"
host_tools = ["rust-objcopy"]
rust_components = ["rust-src", "llvm-tools-preview"]
args = ["prototyper", "build", "--config-file", "${config}", "--target", "${target}", "dynamic"]

[cargo]
cwd = "${source}"

[cargo.env]
CARGO_TARGET_DIR = "${source}/target"

[[cargo_tools]]
name = "cargo-binutils"
version = "0.4.0"
toolchain = "stable"
