schema = 1
name = "u-boot-spacemit-k1"
backend = "kbuild"
source = "spacemit-uboot"
config = "boards/spacemit/muse-card/uboot-minimal.defconfig"
toolchain = "bootlin-riscv64-musl"
artifact = "u-boot.itb"
build_output = "u-boot.itb"
in_tree = true
args = ["u-boot.itb", "SOURCE_DATE_EPOCH=0"]
patches = ["packages/u-boot-spacemit-k1/patches/0001-allow-minimal-k1-boot-configuration.patch"]

[kbuild]
tools = ["gcc", "bison", "flex", "openssl", "python3", "xz"]
config = "olddefconfig"
arch = "riscv"
compiler_pattern = "riscv64*-gcc"
compiler_suffix = "gcc"
host_os = "Linux"
host_arch = "x86_64"

[artifacts]
"Licenses/gpl-2.0.txt" = "LICENSE.u-boot-spacemit-k1"
