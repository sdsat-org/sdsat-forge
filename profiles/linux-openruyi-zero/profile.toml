schema = 1
toolchain = "nightly-2026-07-21"
firmware = "rustsbi"
bootloader = "uboot"
kernel = "linux"

[rootfs]
kind = "prebuilt"
package = "openruyi-zero"

[rootfs.scripts]
"forge-boot-check.sh" = "support/openruyi-zero/boot-check.sh"
"forge-userspace-check.sh" = "support/busybox/boot-check.sh"

[boot]
append = "loglevel=4 console=ttyS0"
test_append = "rdinit=/forge-boot-check.sh"
# RVA23 CPU models need PMP enabled for machine-mode SBI firmware.
cpu = "rva23s64,pmp=true"
memory = "4G"
smp = 2
