[rootfs]
kind = "prebuilt"
package = "openruyi-zero"
gzip_overlay = true

[rootfs.scripts]
"usr/libexec/tianzhi/init" = "support/openruyi-zero/init.sh"
"usr/libexec/tianzhi/boot-check" = "support/openruyi-zero/boot-check.sh"
"usr/libexec/tianzhi/userspace-check" = "support/busybox/boot-check.sh"

[boot]
append = "loglevel=4 console=ttyS0 rdinit=/usr/libexec/tianzhi/init"
test_append = "rdinit=/usr/libexec/tianzhi/boot-check"
script = '''
fdt move ${fdtcontroladdr} ${fdt_addr_r} && setenv fdt_addr ${fdt_addr_r} && sysboot ${devtype} ${devnum}:${distro_bootpart} any ${pxefile_addr_r} /boot/extlinux.conf
'''
# RVA23 CPU models need PMP enabled for machine-mode SBI firmware.
cpu = "rva23s64,pmp=true"
memory = "4G"
smp = 2
qemu_args = ["-netdev", "user,id=net0,restrict=on", "-device", "virtio-net-device,netdev=net0"]
