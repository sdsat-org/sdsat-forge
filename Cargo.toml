[package]
name = "sdsat-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR MulanPSL-2.0"
description = "Build and boot software-defined satellite system stacks"
repository = "https://github.com/sdsat-org/sdsat-forge"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
tempfile = "3.27"
flate2 = "1.1"
tar = "0.4"
