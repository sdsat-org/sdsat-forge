apiVersion: v1
kind: Pod
metadata:
  name: forge-busybox
  namespace: default
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  hostNetwork: true
  hostPID: true
  hostIPC: true
  dnsPolicy: Default
  # The host-network workload does not need a CNI plugin. Permit scheduling
  # while the node reports NetworkPluginNotReady in this isolated demo.
  tolerations:
    - operator: Exists
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: busybox
      image: localhost/forge/busybox:local
      imagePullPolicy: Never
      command: ["/bin/busybox", "sh", "-ec"]
      args:
        - |
          test "$(/bin/busybox uname -m)" = riscv64
          printf 'FORGE_KUBERNETES_POD_OK\n'
          printf 'architecture='
          /bin/busybox uname -m
      securityContext:
        privileged: true
        seccompProfile:
          type: Unconfined
